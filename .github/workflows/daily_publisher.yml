name: Daily Ternak Blog Auto Publisher

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for committing changes back to the repo

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for successful git push

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Run Master Orchestrator
      - name: Run Master Orchestrator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          python orchestrator.py

      # 5. Commit and push updated log and keywords
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add niche_workspaces/*/keywords.txt publish_log.csv
          # Pull latest changes (like the newly published article) to prevent conflicts during testing
          git pull origin HEAD --rebase
          # Commit and push only if there are local modifications
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update publish log and keywords [skip ci]" && git push origin HEAD)
