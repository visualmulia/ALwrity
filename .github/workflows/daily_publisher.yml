name: Daily Ternak Blog Auto Publisher

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      weekday_override:
        description: 'Pilih Blog Niche (0=Senin/AI, 1=Selasa/Productivity, 2=Rabu/Gardening, 3=Kamis/Frugal, 4=Jumat/Travel, 5=Sabtu/Pets, default=Sesuai Hari Ini)'
        required: true
        default: 'default'
        type: choice
        options:
          - 'default'
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for committing changes back to the repo

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for successful git push

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Run Master Orchestrator
      - name: Run Master Orchestrator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT_TOKEN }}
          WEEKDAY_OVERRIDE: ${{ github.event.inputs.weekday_override }}
        run: |
          python orchestrator.py

      # 5. Commit and push updated log and keywords
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Commit locally first if there are modifications, then pull with rebase and push to avoid unstaged conflict errors
          git diff --quiet && git diff --staged --quiet || (git add niche_workspaces/*/keywords.txt publish_log.csv && git commit -m "Update publish log and keywords [skip ci]" && git pull origin HEAD --rebase && git push origin HEAD)
